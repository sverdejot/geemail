name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - run: mise lint
      - run: mise tag
      - run: git push --tags
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise release
