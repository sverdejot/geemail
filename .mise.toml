[tools]
go = "latest"
golangci-lint = "latest"
goreleaser = "latest"
gitversion = "latest"
actionlint = "latest"
aws-cli = "latest"
gh = "latest"

[settings]
experimental = true
auto_install = true

[tasks]
lint = ["golangci-lint run ./...", "goreleaser check", "actionlint"]
deps = ["go mod tidy", "go mod vendor"]
format = ["golangci-lint fmt ./..."]
snapshot = "goreleaser release --snapshot"
dist = "aws s3 cp dist/install.sh s3://${S3_BUCKET}/${DIST_FOLDER}/install.sh --region ${AWS_REGION}"
tag = "echo v$(gitversion -config .gitversion.yml -showvariable MajorMinorPatch)"

[tasks.check-tag]
depends = ["tag"]
run = "git tag $(mise r tag -q) 2>/dev/null || true"

[tasks.release]
depends = ["check-tag"]
run = "gh release view $(mise r tag -q) &>/dev/null || { git push --tags && goreleaser release --clean; }"
